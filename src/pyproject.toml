[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "src"
version = "0.1.0"
description = "Calendar-to-Quidlo Timesheets sync, driven by a Textual TUI and Playwright"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "icalendar>=5.0",
    "playwright>=1.54.0",
    "recurring-ical-events>=2.0",
    "textual>=0.61.0",
]

[project.scripts]
cli = "cli.__main__:main"

[project.optional-dependencies]
dev = ["pyright>=1.1.410", "pytest>=8.0", "ruff>=0.15.17"]

[tool.hatch.build.targets.wheel]
packages = ["cli", "core"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pyright]
venvPath = './.venv'
exclude = ["**/__pycache__", "**/.venv"]
typeCheckingMode = 'strict'

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
